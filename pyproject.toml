[project]
name = "autox-tools"
version = "0.1.0"
description = "Internal scripts and tooling for evaluating and operating on projects."
requires-python = ">=3.11,<3.14"
dependencies = [
    "boto3>=1.28",
    "kfp>=2.15.2",
    "kubernetes>=28.0",
    "pymilvus>=2.4",
    "python-dotenv>=1.0",
    "tabulate>=0.9",
]

[project.scripts]
milvus = "autox_tools.milvus.cli:main"
pipelines = "autox_tools.pipelines.cli:main"
s3 = "autox_tools.s3.cli:main"
experiments = "autox_tools.experiments.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "RUF", # ruff-specific
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "pymilvus.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kfp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "kubernetes.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tabulate.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
